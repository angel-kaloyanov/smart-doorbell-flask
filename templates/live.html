<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="utf-8">
    <title>Live камера</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

    <style>
        body {
            background: #111;
            color: #fff;
        }

        /* Центрираме видеото и ограничаваме максималния размер */
        #videoContainer {
            width: 100%;
            max-width: 780px;      /* контролираш колко голям да е live-а */
            margin: 0 auto;        /* центриране */
            aspect-ratio: 4 / 3;   /* фиксирано съотношение (може и 16/9) */
            overflow: hidden;      /* реже това, което излиза при zoom */
            border-radius: 10px;
            cursor: grab;
            background: #000;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.25s ease, transform-origin 0.25s ease;
            transform-origin: 50% 50%;
            display: block;
        }

        .zoom-btn {
            font-size: 24px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
        }

        .snap-btn {
            font-size: 20px;
            padding: 10px 25px;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-dark mb-3">
    <div class="container d-flex justify-content-between">
        <a class="navbar-brand" href="/">🛎 Видеонаблюдение</a>
        <div class="d-flex gap-3">
            <a class="nav-link text-light" href="/gallery">📷 Галерия</a>
            <a class="nav-link text-light" href="/live">🎥 Live</a>
        </div>
    </div>
</nav>

<div class="container text-center">

    <h2 class="mb-4">🔴 Live преглед от камерата</h2>

    <div class="mb-3 d-flex justify-content-center">
        <div id="videoContainer">
            <img id="video"
                 src="{{ url_for('video_feed') }}"
                 alt="Видео поток от камерата">
        </div>
    </div>

    <!-- Zoom controls -->
    <div class="d-flex justify-content-center gap-3 mb-4">
        <button class="btn btn-primary zoom-btn" onclick="zoomOut()">➖</button>
        <button class="btn btn-primary zoom-btn" onclick="zoomIn()">➕</button>
    </div>

    <!-- Snapshot button -->
    <a href="/live_snapshot" class="btn btn-success snap-btn">
        📸 Направи снимка
    </a>

    <div>
        <a href="/" class="btn btn-secondary mt-4">⬅ Назад</a>
    </div>

</div>

<script>
    let zoomLevel = 1;

    function applyZoom() {
        const video = document.getElementById("video");
        video.style.transform = `scale(${zoomLevel})`;
    }

    function zoomIn() {
        zoomLevel += 0.2;
        applyZoom();
    }

    function zoomOut() {
        zoomLevel = Math.max(1, zoomLevel - 0.2);
        applyZoom();
    }

    function setZoomFocus(event) {
        if (zoomLevel <= 1.01) {
            return;
        }

        const video = document.getElementById("video");
        const rect = video.getBoundingClientRect();

        const xPercent = ((event.clientX - rect.left) / rect.width) * 100;
        const yPercent = ((event.clientY - rect.top) / rect.height) * 100;

        video.style.transformOrigin = `${xPercent}% ${yPercent}%`;
    }

    document.getElementById("videoContainer").addEventListener("click", setZoomFocus);

    document.getElementById("videoContainer").addEventListener("touchstart", function(e) {
        const touch = e.touches[0];
        setZoomFocus(touch);
    });
</script>

</body>
</html>
